<!DOCTYPE html>

<html lang="en">
    <head>
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
        <link href="/static/style.css" rel="stylesheet">
        <title>Focus Now</title>
        {% block bg %}{% endblock %}
    </head>
    <body>
<main class="container py-4" style="max-width: 1400px; margin: 0 auto;">
    <div class="but-container">
        <button class="btn btn-secondary" id="bth">Back to Home</button>
        <button class="btn btn-warning">🪙 : ${{ coins }}</button>
    </div>

    <div style="display: flex; gap: 30px; align-items: flex-start; width: 100%; margin-top: 20px;">

        <div style="flex: 0 0 320px; display: flex; flex-direction: column; align-items: center;">
            <div class="inputs-group mb-3">
                <input type="number" min="0" max="23" id="hours" placeholder="Hr">
                <input type="number" min="0" max="59" id="minutes" placeholder="Min">
                <input type="number" min="0" max="59" id="seconds" placeholder="Sec">
            </div>

            <div class="timer-card">
                {% block theme %}{% endblock %}
                <div class="timer-overlay">
                    <h1 id="timer-display">00:00:00</h1>
                    <label class="play">
                        <input type="checkbox" id="play_pause" checked>
                        <svg class="play" height="20px" viewBox="0 0 384 512">
                            <path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"></path>
                        </svg>
                        <svg class="pause" height="20px" viewBox="0 0 320 512">
                            <path d="M48 64C21.5 64 0 85.5 0 112V400c0 26.5 21.5 48 48 48H80c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48H48zm192 0c-26.5 0-48 21.5-48 48V400c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48H240z"></path>
                        </svg>
                    </label>
                </div>
            </div>

            <div class="mt-3 d-flex gap-2">
                <button type="button" id="start" class="btn btn-primary start-btn">Start</button>
                <button type="button" id="quit" class="btn btn-danger quit-btn">Quit</button>
            </div>
        </div>

    <div style="flex: 1 1 0%; width: 100%; min-width: 0;">
        {% block chart %}{% endblock %}
    </div>
    </div>
   {% block body %}{% endblock %}
</main>
    </body>
</html>
