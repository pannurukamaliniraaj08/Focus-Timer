<!DOCTYPE html>
<html lang="en">

    <head>
        <meta name = "viewport" content = "initial-scale = 1, width = device-width">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <title>Index</title>
    </head>
     <body>
        <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
            <div id="coinToast" class="toast align-items-center border-0" role="alert" style="background-color: #f5e6d3; color: #6b4f3a;">
                <div class="d-flex">
                    <div class="toast-body">
                        Not enough coins for that 🪙
                    </div>
                    <button type="button" class="btn-close btn-close-sm me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>
        <header class="top-nav">
            <div class="nav-spacer"></div>Choose Your Style
            <div class="but-container">
                <button id="btl">Back to Login</button>
                <button>🪙 : ${{ coins }}</button>
            </div></header>
         <div class="home-container">
            <div class="card" id="light" href="{{ url_for('light') }}">
                <div class="image-light"></div>
                <span class="title">Default mode 1</span>
                <span class="price">FREE</span>
            </div>
            <div class="card" id="dark" href="{{ url_for('dark') }}">
                <div class="image-dark"></div>
                <span class="title">Default mode 2</span>
                <span class="price">FREE</span>
            </div>
            <div class="card" id="pastel" href="{{ url_for('pastel') }}">
                <div class="image-pastel"></div>
                <span class="title">Pastel Sunset</span>
                <span class="price">$100</span>
            </div>
            <div class="card" id="forest" href="{{ url_for('forest') }}">
                <div class="image-forest"></div>
                <span class="title">Forest sanctuary</span>
                <span class="price">$500</span>
            </div>
            <div class="card" id="cyberpunk" href="{{ url_for('cyberpunk') }}">
                <div class="image-cyberpunk"></div>
                <span class="title">Cyberpunk Neon</span>
                <span class="price">$600</span>
            </div>
            <div class="card" id="expresso" id="/expresso" href="{{ url_for('expresso') }}">
                <div class="image-expresso"></div>
                <span class="title">Expresso Grind</span>
                <span class="price">$1500</span>
            </div>
        </div>
     </body>
     <script>
        let light = document.querySelector("#light");
        let dark = document.querySelector("#dark");
        let pastel = document.querySelector("#pastel");
        let forest = document.querySelector("#forest");
        let cyberpunk = document.querySelector("#cyberpunk");
        let expresso = document.querySelector("#expresso");
        let btl = document.querySelector("#btl");

        btl.addEventListener('click', function(){
            window.location.href= "/login"
        })

        // Not enough coins message
        function showCoinToast(message) {
            const toastEl = document.getElementById('coinToast');
            toastEl.querySelector('.toast-body').textContent = message;
            const toast = new bootstrap.Toast(toastEl, { delay: 2500 });
            toast.show();
        }

        light.addEventListener('click',function(){
            window.location.href = "/light"
        });
        dark.addEventListener('click',function(){
            window.location.href = "/dark"
        });
        pastel.addEventListener('click', function(){
            fetch("/buy/pastel", { method: "POST" })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = "/pastel";
                } else {
                    showCoinToast(data.error);
                }
            });
        });
        forest.addEventListener('click', function(){
            fetch("/buy/forest", { method: "POST" })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = "/forest";
                } else {
                    showCoinToast(data.error);
                }
            });
        });
        cyberpunk.addEventListener('click', function(){
            fetch("/buy/cyberpunk", { method: "POST" })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = "/cyberpunk";
                } else {
                    showCoinToast(data.error);
                }
            });
        });
        expresso.addEventListener('click', function(){
            fetch("/buy/expresso", { method: "POST" })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = "/expresso";
                } else {
                    showCoinToast(data.error);
                }
            });
        });
     </script>
</html>
