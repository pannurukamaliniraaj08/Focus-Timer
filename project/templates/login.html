<!DOCTYPE html>
<html lang="en">

    <head>
        <meta name = "viewport" content = "initial-scale = 1, width = device-width">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
        <title>Log In</title>
    </head>
     <body class = "login_background register_container">
            <form action="/login" method="post">
            <div class="mb-3">
                <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="username" placeholder="Username" type="text">
            </div>
            <div class="mb-3">
                <input class="form-control mx-auto w-auto" name="password" placeholder="Password" type="password">
            </div>
            <div class="button-group d-flex flex-column align-items-center gap-2">
                <button type="submit" class="btn btn-primary px-4">Log In</button>
                <a href="/register" class="btn btn-outline-secondary px-3">Register</a>
            </div>
            </form>

     </body>

</html>
